version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: risk-copilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - risk-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: risk-copilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - risk-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: risk-copilot-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - risk-network

networks:
  risk-network:
    driver: bridge
